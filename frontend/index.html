<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // Supports "light" | "dark" | "system" (default: system).
      (function () {
        try {
          var t = localStorage.getItem("whizunik-theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whizunik — Receivables factoring &amp; monitoring</title>
    <meta
      name="description"
      content="An institutional-grade factoring platform with live aging, debtor risk, advance ledger, and real-time alerts."
    />
    <meta property="og:title" content="Whizunik — Receivables factoring &amp; monitoring" />
    <meta
      property="og:description"
      content="Factoring, advances, and debtor monitoring in one vault."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
